version: "3.9"

services:
  app:
    build: .
    environment:
      # Frontend Configuration
      - NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG=${NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG:-false}
      - NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG=${NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG:-default}
      - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=${NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN:-learnhouse.example.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-here}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://learnhouse.example.com}
      
      # Backend Configuration
      - LEARNHOUSE_COOKIE_DOMAIN=${LEARNHOUSE_COOKIE_DOMAIN:-.learnhouse.example.com}
      - LEARNHOUSE_SQL_CONNECTION_STRING=${LEARNHOUSE_SQL_CONNECTION_STRING:-postgresql://learnhouse:learnhouse@db:5432/learnhouse}
      - LEARNHOUSE_REDIS_CONNECTION_STRING=${LEARNHOUSE_REDIS_CONNECTION_STRING:-redis://redis:6379}
      - LEARNHOUSE_CHROMADB_HOST=${LEARNHOUSE_CHROMADB_HOST:-chromadb}
      
      # System Configuration
      - PORT=3000
    networks:
      - learnhouse-network
      - learnhouse-internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    labels:
      # Coolify Management
      - coolify.managed=true
      - coolify.env.inject=true
      
      # Traefik Configuration
      - traefik.enable=true
      - traefik.http.middlewares.learnhouse-gzip.compress=true
      - traefik.http.middlewares.learnhouse-redirect.redirectscheme.scheme=https
      - traefik.http.routers.learnhouse-http.entrypoints=http
      - traefik.http.routers.learnhouse-http.middlewares=learnhouse-redirect
      - traefik.http.routers.learnhouse-http.rule=Host(`${NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN}`)
      - traefik.http.routers.learnhouse-https.entrypoints=https
      - traefik.http.routers.learnhouse-https.middlewares=learnhouse-gzip
      - traefik.http.routers.learnhouse-https.rule=Host(`${NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN}`)
      - traefik.http.routers.learnhouse-https.tls=true
      - traefik.http.routers.learnhouse-https.tls.certresolver=letsencrypt
      - traefik.http.services.learnhouse.loadbalancer.server.port=3000
      
      # Caddy Configuration
      - caddy.encode=zstd gzip
      - caddy.handle_path.0_reverse_proxy={{upstreams 3000}}
      - caddy.handle_path=/*
      - caddy.header=-Server
      - caddy.try_files={path} /index.html /index.php
      - caddy=https://${NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN}

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=learnhouse
      - POSTGRES_DB=learnhouse
    networks:
      - learnhouse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5
    volumes:
      - learnhouse-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.3
    networks:
      - learnhouse-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5
    volumes:
      - learnhouse-redis-data:/data

  chromadb:
    image: chromadb/chroma:0.5.16
    networks:
      - learnhouse-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  learnhouse-network:
  learnhouse-internal:
    internal: true

volumes:
  learnhouse-db-data:
  learnhouse-redis-data:
